name: app
description: "photo_collector guest app: upload photos and videos directly to event storage."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.6
  ctx: ^1.0.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^2.4.4
  go_router: ^14.0.0
  http: ^1.6.0
  meta: ^1.19.0
  package_info_plus: ^10.2.2
  s3_client: ^1.0.0
  uuid: ^4.5.1
  web: ^1.1.0

# s3_client requires meta ^1.19.0 while flutter_test on Flutter 3.44 pins
# meta to 1.18.0. meta is annotations-only, so overriding is safe; remove
# this override after upgrading to a Flutter whose flutter_test allows
# meta 1.19+ (e.g. 3.47.x / Dart 3.13).
dependency_overrides:
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.8

flutter:
  uses-material-design: true
  generate: true
